app = "linkstr-push-service"
primary_region = "dfw"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
dockerfile = "Dockerfile"

[env]
LISTEN_ADDR = ":8080"
DATABASE_PATH = "/data/push-service.db"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "5s"
interval = "30s"
method = "GET"
timeout = "2s"
path = "/healthz"

[[mounts]]
source = "linkstr_push_service_data"
destination = "/data"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
