name: linkstr
options:
  deploymentTarget:
    iOS: 18.0
  createIntermediateGroups: true
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "5.10"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
packages:
  NostrSDK:
    url: https://github.com/therealparmesh/nostr-sdk-ios.git
    revision: 4bbfcd895738997174fc35325743c4076151659f
  EmojiKit:
    url: https://github.com/danielsaidi/EmojiKit.git
    from: 2.0.0
schemes:
  linkstr:
    build:
      targets:
        linkstr: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: linkstrTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  linkstr:
    type: application
    platform: iOS
    deploymentTarget: 18.0
    sources:
      - path: linkstrApp
    dependencies:
      - target: linkstrShareExtension
      - package: NostrSDK
      - package: EmojiKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parmscript.linkstr
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: linkstrApp/Info.plist
        DEVELOPMENT_TEAM: "7654L3CX5L"
        LINKSTR_PUSH_SERVICE_BASE_URL: "https://linkstr-push-service.fly.dev"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: linkstrApp/linkstr.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: linkstrApp/linkstr.Release.entitlements
    info:
      path: linkstrApp/Info.plist
      properties:
        CFBundleDisplayName: linkstr
        CFBundleShortVersionString: "1.6.0"
        CFBundleVersion: "31"
        LinkstrPushServiceBaseURL: $(LINKSTR_PUSH_SERVICE_BASE_URL)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: use the camera to scan a contact’s public key.
        NSPhotoLibraryAddUsageDescription: allow linkstr to save videos to photos.
        UILaunchStoryboardName: LaunchScreen
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        ITSAppUsesNonExemptEncryption: false
        # Keep existing iCloud backup folders accessible in Files.
        NSUbiquitousContainers:
          iCloud.com.parmscript.linkstr:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: linkstr
            NSUbiquitousContainerSupportedFolderLevels: Any
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.parmscript.linkstr.backup
            UTTypeDescription: linkstr backup
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - linkstrbackup
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleURLTypes:
          - CFBundleURLName: com.parmscript.linkstr.deeplink
            CFBundleURLSchemes:
              - linkstr

  linkstrShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: 18.0
    sources:
      - path: linkstrShareExtension
      - path: linkstrApp/App/LinkstrAppearance.swift
      - path: linkstrApp/App/LinkstrTabHeader.swift
      - path: linkstrApp/Domain/LinkstrURLValidator.swift
      - path: linkstrApp/Domain/LinkstrDeepLinkCodec.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parmscript.linkstr.ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "7654L3CX5L"
        INFOPLIST_FILE: linkstrShareExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: linkstrShareExtension/Info.plist
      properties:
        CFBundleDisplayName: linkstr
        CFBundleShortVersionString: "1.6.0"
        CFBundleVersion: "31"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  linkstrTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 18.0
    sources:
      - path: linkstrTests
    dependencies:
      - target: linkstr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
